name: Code checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
      - name: Install test dependency
        run: Rscript -e 'install.packages("data.table", repos="https://cloud.r-project.org")'
      - name: Check approved sharing files
        run: Rscript --vanilla tools/check_share.R
      - name: Parse code and run synthetic checks
        run: Rscript --vanilla tests/check_code.R
